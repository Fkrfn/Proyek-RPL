<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tugasku – Semua tugas kuliah di satu tempat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
  colors: { ink: '#16213E', brand: '#2B4EFF', paper: '#F2F4F9' } } } };
</script>
<style>
  :focus-visible { outline: 2px solid #2B4EFF; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .view { display: none; } .view.active { display: block; }
  .toast { transition: transform .25s, opacity .25s; }
</style>
</head>
<body class="bg-paper text-ink font-sans min-h-screen">

<!-- Sidebar (desktop) -->
<aside class="hidden md:flex fixed inset-y-0 left-0 w-60 flex-col bg-ink text-white p-5">
  <div class="flex items-center gap-2 mb-8">
    <span class="w-9 h-9 rounded-lg bg-brand grid place-items-center"><i class="fa-solid fa-check"></i></span>
    <span class="text-xl font-extrabold tracking-tight">Tugasku</span>
  </div>
  <nav class="space-y-1" id="sideNav"></nav>
  <button data-open-modal class="mt-auto bg-brand hover:bg-blue-600 rounded-lg py-2.5 font-semibold text-sm"><i class="fa-solid fa-plus mr-2"></i>Tambah tugas</button>
</aside>

<!-- Bottom nav (mobile) -->
<nav class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 grid grid-cols-3" id="bottomNav"></nav>

<main class="md:ml-60 p-4 sm:p-8 pb-28 md:pb-8 max-w-5xl">

  <header class="flex items-start justify-between gap-4 mb-6">
    <div>
      <p class="text-sm text-slate-500" id="todayLabel"></p>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight" id="pageTitle">Dashboard</h1>
    </div>
    <button data-open-modal class="md:hidden bg-brand text-white rounded-full w-11 h-11 shrink-0" aria-label="Tambah tugas"><i class="fa-solid fa-plus"></i></button>
  </header>

  <!-- DASHBOARD -->
  <section id="view-dashboard" class="view active">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" id="stats"></div>

    <div class="grid lg:grid-cols-3 gap-4 mt-4">
      <div class="lg:col-span-2 bg-white rounded-xl p-5 border border-slate-200">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold">Tenggat terdekat</h2>
          <button class="text-sm text-brand font-semibold hover:underline" data-go="tugas">Lihat semua</button>
        </div>
        <ul class="divide-y divide-slate-100" id="upcoming"></ul>
      </div>
      <div class="bg-white rounded-xl p-5 border border-slate-200">
        <h2 class="font-bold mb-3">Progres tugas</h2>
        <div class="h-3 rounded-full bg-slate-100 overflow-hidden"><div id="bar" class="h-full bg-brand transition-all duration-500" style="width:0"></div></div>
        <p class="text-sm text-slate-500 mt-2" id="barText"></p>
        <h3 class="font-bold mt-6 mb-3 text-sm">Tugas per sumber</h3>
        <ul class="space-y-2 text-sm" id="bySource"></ul>
      </div>
    </div>
  </section>

  <!-- TUGAS -->
  <section id="view-tugas" class="view">
    <div class="bg-white rounded-xl border border-slate-200 p-3 sm:p-4 flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input id="q" type="search" placeholder="Cari tugas atau mata kuliah" class="w-full pl-9 pr-3 py-2 rounded-lg border border-slate-200 text-sm">
      </div>
      <select id="fSource" class="rounded-lg border border-slate-200 px-3 py-2 text-sm bg-white">
        <option value="all">Semua sumber</option><option>LMS</option><option>WhatsApp</option><option>Email</option><option>Manual</option>
      </select>
      <div class="flex rounded-lg border border-slate-200 overflow-hidden text-sm" id="fStatus">
        <button data-s="all" class="px-3 py-2 font-semibold">Semua</button>
        <button data-s="open" class="px-3 py-2 font-semibold">Belum</button>
        <button data-s="done" class="px-3 py-2 font-semibold">Selesai</button>
      </div>
    </div>

    <div class="flex gap-2 my-4" id="modeTabs" role="tablist">
      <button data-mode="list" role="tab" class="px-4 py-2 rounded-full text-sm font-semibold"><i class="fa-solid fa-list mr-2"></i>Daftar</button>
      <button data-mode="cal" role="tab" class="px-4 py-2 rounded-full text-sm font-semibold"><i class="fa-regular fa-calendar mr-2"></i>Kalender</button>
    </div>

    <ul id="taskList" class="space-y-2"></ul>

    <div id="calWrap" class="hidden">
      <div class="bg-white rounded-xl border border-slate-200 p-4">
        <div class="flex items-center justify-between mb-3">
          <button id="prevM" class="w-9 h-9 rounded-lg hover:bg-slate-100" aria-label="Bulan sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
          <h2 class="font-bold" id="monthLabel"></h2>
          <button id="nextM" class="w-9 h-9 rounded-lg hover:bg-slate-100" aria-label="Bulan berikutnya"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="grid grid-cols-7 text-center text-xs text-slate-500 mb-1">
          <span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span>
        </div>
        <div class="grid grid-cols-7 gap-1" id="calGrid"></div>
      </div>
      <h3 class="font-bold mt-5 mb-2" id="dayTitle"></h3>
      <ul id="dayList" class="space-y-2"></ul>
    </div>
  </section>

  <!-- PENGATURAN / SUMBER -->
  <section id="view-sumber" class="view">
    <p class="text-slate-600 mb-4 max-w-xl">Hubungkan sumber informasi tugasmu. Pada versi demo ini tombol hanya mensimulasikan koneksi.</p>
    <ul class="space-y-3" id="sources"></ul>
  </section>
</main>

<!-- MODAL FORM -->
<div id="modal" class="fixed inset-0 z-40 hidden items-end sm:items-center justify-center bg-ink/60 p-0 sm:p-4" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <form id="taskForm" class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4" novalidate>
    <div class="flex items-center justify-between">
      <h2 id="mTitle" class="text-lg font-extrabold">Tambah tugas</h2>
      <button type="button" data-close class="w-8 h-8 rounded-lg hover:bg-slate-100" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <label class="block text-sm font-semibold">Nama tugas
      <input id="fName" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 font-normal" placeholder="Contoh: Laporan praktikum 3">
    </label>
    <label class="block text-sm font-semibold">Mata kuliah
      <input id="fCourse" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 font-normal" placeholder="Contoh: Basis Data">
    </label>
    <div class="grid grid-cols-2 gap-3">
      <label class="block text-sm font-semibold">Sumber informasi
        <select id="fSrc" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 font-normal bg-white">
          <option>LMS</option><option>WhatsApp</option><option>Email</option><option>Manual</option>
        </select>
      </label>
      <label class="block text-sm font-semibold">Tenggat
        <input id="fDue" type="date" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 font-normal">
      </label>
    </div>
    <p id="formErr" class="text-sm text-red-600 hidden"></p>
    <div class="flex gap-2 pt-1">
      <button type="button" data-close class="flex-1 rounded-lg border border-slate-200 py-2.5 font-semibold text-sm">Batal</button>
      <button type="submit" class="flex-1 rounded-lg bg-brand text-white py-2.5 font-semibold text-sm">Simpan tugas</button>
    </div>
  </form>
</div>

<!-- TOAST -->
<div id="toast" class="toast fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-50 bg-ink text-white text-sm px-4 py-2.5 rounded-lg opacity-0 translate-y-4 pointer-events-none" role="status"></div>

<script>
// ---------- Data & helpers ----------
const SRC = {
  LMS:      { label: 'LMS Kampus', icon: 'fa-graduation-cap', cls: 'bg-sky-100 text-sky-800' },
  WhatsApp: { label: 'WhatsApp',   icon: 'fa-brands fa-whatsapp', cls: 'bg-emerald-100 text-emerald-800' },
  Email:    { label: 'Email',      icon: 'fa-envelope', cls: 'bg-amber-100 text-amber-800' },
  Manual:   { label: 'Manual',     icon: 'fa-pen', cls: 'bg-slate-100 text-slate-700' }
};
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const diffDays = s => Math.round((parse(s) - today0()) / 864e5);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dueText = s => { const n = diffDays(s);
  return n < 0 ? `Terlambat ${-n} hari` : n === 0 ? 'Hari ini' : n === 1 ? 'Besok' : `${n} hari lagi`; };
const dueCls = (t) => t.done ? 'text-slate-400' : diffDays(t.due) < 0 ? 'text-red-600' : diffDays(t.due) <= 2 ? 'text-orange-600' : 'text-slate-500';

let tasks = [
  { id: 1, name: 'Laporan praktikum ERD',      course: 'Basis Data',        source: 'LMS',      due: addDays(1),  done: false },
  { id: 2, name: 'Kuis bab 4 (daring)',        course: 'Statistika',        source: 'LMS',      due: addDays(0),  done: false },
  { id: 3, name: 'Revisi proposal kelompok',   course: 'Metodologi Riset',  source: 'WhatsApp', due: addDays(3),  done: false },
  { id: 4, name: 'Ringkasan jurnal 2 halaman', course: 'Bahasa Inggris',    source: 'Email',    due: addDays(6),  done: false },
  { id: 5, name: 'Presentasi studi kasus',     course: 'Sistem Informasi',  source: 'WhatsApp', due: addDays(9),  done: false },
  { id: 6, name: 'Tugas flowchart',            course: 'Algoritma',         source: 'LMS',      due: addDays(-2), done: true  },
  { id: 7, name: 'Resume materi pertemuan 5',  course: 'Etika Profesi',     source: 'Manual',   due: addDays(-1), done: true  }
];
let nextId = 8, mode = 'list', status = 'all', page = 'dashboard';
let cal = { y: new Date().getFullYear(), m: new Date().getMonth(), sel: ymd(new Date()) };

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const tag = k => `<span class="inline-flex items-center gap-1.5 text-xs font-semibold px-2 py-1 rounded-md ${SRC[k].cls}"><i class="fa-solid ${SRC[k].icon}"></i>${SRC[k].label}</span>`;

// ---------- Navigation ----------
const PAGES = [
  { id: 'dashboard', label: 'Dashboard', icon: 'fa-table-columns' },
  { id: 'tugas',     label: 'Tugas',     icon: 'fa-list-check' },
  { id: 'sumber',    label: 'Sumber',    icon: 'fa-plug' }
];
$('#sideNav').innerHTML = PAGES.map(p => `<button data-go="${p.id}" class="nav-s w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-left"><i class="fa-solid ${p.icon} w-4"></i>${p.label}</button>`).join('');
$('#bottomNav').innerHTML = PAGES.map(p => `<button data-go="${p.id}" class="nav-b py-3 text-xs font-semibold flex flex-col items-center gap-1"><i class="fa-solid ${p.icon} text-base"></i>${p.label}</button>`).join('');

function go(id) {
  page = id;
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + id));
  $('#pageTitle').textContent = PAGES.find(p => p.id === id).label;
  $$('.nav-s').forEach(b => { const on = b.dataset.go === id; b.classList.toggle('bg-white/10', on); b.classList.toggle('text-slate-300', !on); });
  $$('.nav-b').forEach(b => { const on = b.dataset.go === id; b.classList.toggle('text-brand', on); b.classList.toggle('text-slate-500', !on); });
  render();
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go);
  if (e.target.closest('[data-open-modal]')) openModal();
  if (e.target.closest('[data-close]') || e.target === $('#modal')) closeModal();
});

// ---------- Toast ----------
let tt;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg;
  t.classList.remove('opacity-0', 'translate-y-4');
  clearTimeout(tt); tt = setTimeout(() => t.classList.add('opacity-0', 'translate-y-4'), 2200);
}

// ---------- Dashboard ----------
function renderDashboard() {
  const open = tasks.filter(t => !t.done), done = tasks.length - open.length;
  const next = open.slice().sort((a, b) => a.due.localeCompare(b.due))[0];
  const cards = [
    { l: 'Total tugas', v: tasks.length, i: 'fa-layer-group', c: 'text-ink' },
    { l: 'Belum selesai', v: open.length, i: 'fa-hourglass-half', c: 'text-orange-600' },
    { l: 'Tenggat terdekat', v: next ? dueText(next.due) : '–', i: 'fa-bell', c: 'text-brand', sm: true, sub: next ? next.name : 'Semua beres' },
    { l: 'Selesai', v: done, i: 'fa-circle-check', c: 'text-emerald-600' }
  ];
  $('#stats').innerHTML = cards.map(c => `
    <div class="bg-white rounded-xl border border-slate-200 p-4">
      <div class="flex items-center justify-between text-sm text-slate-500"><span>${c.l}</span><i class="fa-solid ${c.i} ${c.c}"></i></div>
      <p class="mt-2 font-extrabold ${c.sm ? 'text-xl' : 'text-3xl'} ${c.c}">${c.v}</p>
      ${c.sub ? `<p class="text-xs text-slate-500 mt-1 truncate">${esc(c.sub)}</p>` : ''}
    </div>`).join('');

  const up = open.slice().sort((a, b) => a.due.localeCompare(b.due)).slice(0, 4);
  $('#upcoming').innerHTML = up.length ? up.map(t => `
    <li class="py-3 flex items-center gap-3">
      <div class="min-w-0 flex-1"><p class="font-semibold truncate">${esc(t.name)}</p><p class="text-sm text-slate-500 truncate">${esc(t.course)}</p></div>
      <span class="hidden sm:block">${tag(t.source)}</span>
      <span class="text-sm font-semibold ${dueCls(t)} w-28 text-right">${dueText(t.due)}</span>
    </li>`).join('') : '<li class="py-6 text-center text-slate-500">Tidak ada tugas yang menunggu. Tambahkan tugas baru dengan tombol di atas.</li>';

  const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
  $('#bar').style.width = pct + '%';
  $('#barText').textContent = `${done} dari ${tasks.length} tugas selesai (${pct}%)`;
  $('#bySource').innerHTML = Object.keys(SRC).map(k => `<li class="flex items-center justify-between">${tag(k)}<span class="font-bold">${tasks.filter(t => t.source === k).length}</span></li>`).join('');
}

// ---------- Task list ----------
function filtered() {
  const q = $('#q').value.trim().toLowerCase(), s = $('#fSource').value;
  return tasks.filter(t =>
    (!q || (t.name + ' ' + t.course).toLowerCase().includes(q)) &&
    (s === 'all' || t.source === s) &&
    (status === 'all' || (status === 'done') === t.done)
  ).sort((a, b) => a.done - b.done || a.due.localeCompare(b.due));
}
function taskItem(t) {
  return `<li class="bg-white rounded-xl border border-slate-200 p-3 sm:p-4 flex items-center gap-3">
    <button data-toggle="${t.id}" aria-label="Tandai ${t.done ? 'belum selesai' : 'selesai'}" class="w-6 h-6 shrink-0 rounded-full border-2 grid place-items-center ${t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-brand'}">${t.done ? '<i class="fa-solid fa-check text-xs"></i>' : ''}</button>
    <div class="min-w-0 flex-1">
      <p class="font-semibold truncate ${t.done ? 'line-through text-slate-400' : ''}">${esc(t.name)}</p>
      <p class="text-sm text-slate-500 truncate">${esc(t.course)} · <span class="${dueCls(t)} font-medium">${t.done ? 'Selesai' : dueText(t.due)}</span></p>
    </div>
    <span class="hidden sm:block">${tag(t.source)}</span>
    <button data-del="${t.id}" aria-label="Hapus tugas" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-600"><i class="fa-regular fa-trash-can"></i></button>
  </li>`;
}
const EMPTY = '<li class="bg-white rounded-xl border border-dashed border-slate-300 p-8 text-center text-slate-500">Tidak ada tugas yang cocok. Ubah kata kunci atau filter, atau tambahkan tugas baru.</li>';
function renderList() {
  const list = filtered();
  $('#taskList').innerHTML = list.length ? list.map(taskItem).join('') : EMPTY;
}

// ---------- Calendar ----------
function renderCal() {
  $('#monthLabel').textContent = `${MONTHS[cal.m]} ${cal.y}`;
  const first = new Date(cal.y, cal.m, 1), lead = (first.getDay() + 6) % 7, days = new Date(cal.y, cal.m + 1, 0).getDate();
  const list = filtered();
  let h = '<span></span>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const key = `${cal.y}-${pad(cal.m + 1)}-${pad(d)}`, ts = list.filter(t => t.due === key);
    const isSel = key === cal.sel, isToday = key === ymd(new Date());
    const dots = ts.slice(0, 3).map(t => `<i class="w-1.5 h-1.5 rounded-full ${t.done ? 'bg-emerald-500' : 'bg-brand'}"></i>`).join('');
    h += `<button data-day="${key}" class="aspect-square rounded-lg text-sm flex flex-col items-center justify-center gap-1 ${isSel ? 'bg-ink text-white' : isToday ? 'ring-2 ring-brand' : 'hover:bg-slate-100'}"><span class="font-semibold">${d}</span><span class="flex gap-0.5 h-1.5">${dots}</span></button>`;
  }
  $('#calGrid').innerHTML = h;
  const s = parse(cal.sel), ts = list.filter(t => t.due === cal.sel);
  $('#dayTitle').textContent = `${DAYS[s.getDay()]}, ${s.getDate()} ${MONTHS[s.getMonth()]}`;
  $('#dayList').innerHTML = ts.length ? ts.map(taskItem).join('') : '<li class="text-slate-500 text-sm">Tidak ada tenggat pada hari ini.</li>';
}

function renderTasksView() {
  $('#taskList').classList.toggle('hidden', mode !== 'list');
  $('#calWrap').classList.toggle('hidden', mode !== 'cal');
  $$('#modeTabs button').forEach(b => { const on = b.dataset.mode === mode; b.classList.toggle('bg-ink', on); b.classList.toggle('text-white', on); b.classList.toggle('bg-white', !on); b.classList.toggle('border', !on); b.classList.toggle('border-slate-200', !on); });
  $$('#fStatus button').forEach(b => { const on = b.dataset.s === status; b.classList.toggle('bg-ink', on); b.classList.toggle('text-white', on); });
  mode === 'list' ? renderList() : renderCal();
}

// ---------- Sources (simulated) ----------
const connected = { LMS: true, WhatsApp: false, Email: false };
function renderSources() {
  const desc = { LMS: 'Tarik tugas dan tenggat dari portal kuliah.', WhatsApp: 'Tangkap pesan tugas dari grup kelas.', Email: 'Ambil pengumuman tugas dari email dosen.' };
  $('#sources').innerHTML = Object.keys(connected).map(k => `
    <li class="bg-white rounded-xl border border-slate-200 p-4 flex items-center gap-4">
      <span class="w-11 h-11 rounded-lg grid place-items-center ${SRC[k].cls}"><i class="fa-solid ${SRC[k].icon}"></i></span>
      <div class="flex-1 min-w-0"><p class="font-bold">${SRC[k].label}</p><p class="text-sm text-slate-500">${desc[k]}</p></div>
      <button data-conn="${k}" class="px-4 py-2 rounded-lg text-sm font-semibold ${connected[k] ? 'bg-emerald-50 text-emerald-700' : 'bg-brand text-white'}">${connected[k] ? 'Terhubung' : 'Hubungkan'}</button>
    </li>`).join('');
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { const k = tasks.find(x => x.id == t.dataset.toggle); k.done = !k.done; toast(k.done ? 'Tugas ditandai selesai' : 'Tugas dikembalikan ke belum selesai'); render(); }
  const d = e.target.closest('[data-del]');
  if (d) { tasks = tasks.filter(x => x.id != d.dataset.del); toast('Tugas dihapus'); render(); }
  const day = e.target.closest('[data-day]'); if (day) { cal.sel = day.dataset.day; renderCal(); }
  const m = e.target.closest('#modeTabs [data-mode]'); if (m) { mode = m.dataset.mode; renderTasksView(); }
  const s = e.target.closest('#fStatus [data-s]'); if (s) { status = s.dataset.s; renderTasksView(); }
  const c = e.target.closest('[data-conn]');
  if (c) { const k = c.dataset.conn; connected[k] = !connected[k]; toast(connected[k] ? `${SRC[k].label} terhubung (simulasi)` : `${SRC[k].label} diputus`); renderSources(); }
});
$('#q').addEventListener('input', renderTasksView);
$('#fSource').addEventListener('change', renderTasksView);
$('#prevM').onclick = () => { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } renderCal(); };
$('#nextM').onclick = () => { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } renderCal(); };

// ---------- Modal & form ----------
function openModal() { $('#taskForm').reset(); $('#fDue').value = addDays(1); $('#formErr').classList.add('hidden'); $('#modal').classList.replace('hidden', 'flex'); $('#fName').focus(); }
function closeModal() { $('#modal').classList.replace('flex', 'hidden'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#taskForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#fName').value.trim(), course = $('#fCourse').value.trim(), due = $('#fDue').value;
  if (!name || !course || !due) { const er = $('#formErr'); er.textContent = 'Lengkapi nama tugas, mata kuliah, dan tenggat.'; er.classList.remove('hidden'); return; }
  tasks.push({ id: nextId++, name, course, source: $('#fSrc').value, due, done: false });
  closeModal(); toast('Tugas disimpan'); render();
});

// ---------- Init ----------
function render() {
  if (page === 'dashboard') renderDashboard();
  if (page === 'tugas') renderTasksView();
  if (page === 'sumber') renderSources();
}
const n = new Date();
$('#todayLabel').textContent = `${DAYS[n.getDay()]}, ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
go('dashboard');
</script>
</body>
</html>
